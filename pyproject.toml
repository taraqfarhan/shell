[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shell"
version = "0.1.0"
description = "A custom Unix shell built in Python"
requires-python = ">=3.8"

[project.scripts]
sh = "sh.shell:main"
sh-gui = "sh_gui.__main__:main"
barber = "sh_gui.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sh", "sh_gui"]




